<div class="quotations">
  <app-page-header
    icon="file-check"
    title="Cotizaciones"
    subtitle="Una cotización es una propuesta comercial — nunca afecta el inventario ni se registra como una venta real."
  />

  <div class="tabs" role="tablist">
    <button
      type="button"
      role="tab"
      class="tab"
      [class.tab--active]="activeTab() === 'crear'"
      [attr.aria-selected]="activeTab() === 'crear'"
      (click)="selectTab('crear')"
    >
      Crear
    </button>
    <button
      type="button"
      role="tab"
      class="tab"
      [class.tab--active]="activeTab() === 'historial'"
      [attr.aria-selected]="activeTab() === 'historial'"
      (click)="selectTab('historial')"
    >
      Historial
    </button>
  </div>

  @if (activeTab() === 'crear') {
    <app-create-quotation-tab />
  } @else {
    <app-quotation-history-tab />
  }
</div>
