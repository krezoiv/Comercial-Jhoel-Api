@if (pending(); as options) {
  <div class="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pdf-prompt-title" (click)="$event.stopPropagation()">
      <button
        type="button"
        class="modal__close"
        aria-label="Cerrar"
        [disabled]="isGenerating()"
        (click)="dismiss()"
      >
        <app-icon name="close" [size]="18" />
      </button>

      <div class="modal__icon">
        <app-icon name="file-check" [size]="24" />
      </div>

      <h2 class="modal__title" id="pdf-prompt-title">{{ options.title }}</h2>
      <p class="modal__description">{{ options.message }}</p>

      @if (errorMessage(); as error) {
        <p class="modal__error">{{ error }}</p>
      }

      <div class="modal__actions">
        <app-button variant="ghost" [disabled]="isGenerating()" (click)="dismiss()">No</app-button>
        <app-button variant="ghost" [disabled]="isGenerating()" (click)="dismiss()">Cancelar</app-button>
        <app-button variant="primary" [disabled]="isGenerating()" (click)="generate()">
          {{ isGenerating() ? 'Generando...' : 'Sí, generar PDF' }}
        </app-button>
      </div>
    </div>
  </div>
}
