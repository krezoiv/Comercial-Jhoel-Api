<app-section sectionId="servicios" tone="dark" spacing="lg" [fluidContainer]="true">
  <app-section-landing-background sectionKey="servicios" />
  <div class="services__glow" [appParallaxLayer]="0.06" aria-hidden="true"></div>
  <div class="services__glow services__glow--blue" [appParallaxLayer]="0.1" aria-hidden="true"></div>

  <div appRevealOnScroll>
    <app-section-heading
      eyebrow="Nuestros servicios"
      title="Un solo lugar para resolver el día a día de tu negocio y tu familia"
      subtitle="Desde los útiles del colegio hasta tus operaciones bancarias, sin perder tiempo yendo de un lado a otro."
    />
  </div>

  <div class="services__grid">
    @for (service of services$ | async; track service.id; let i = $index) {
      <div class="services__item" appRevealOnScroll revealVariant="scale" [revealDelay]="i * 80">
        <article class="service-card" [appTiltOnMouse]="true" [tiltMax]="5">
          <div class="service-card__visual" aria-hidden="true">
            <div class="service-card__visual-grid"></div>
            <app-icon class="service-card__visual-art" [name]="service.icon" [size]="132" />
            <div class="service-card__icon">
              <app-icon [name]="service.icon" [size]="24" />
            </div>
          </div>

          <div class="service-card__body">
            @if (service.tag) {
              <span class="service-card__tag">{{ service.tag }}</span>
            }
            <h3 class="service-card__title">{{ service.title }}</h3>
            <p class="service-card__description">{{ service.description }}</p>

            <a class="service-card__cta" routerLink="/" [fragment]="service.fragment ?? 'contacto'">
              {{ service.ctaLabel ?? 'Conocer más' }}
              <app-icon name="arrow-right" [size]="16" />
            </a>
          </div>
        </article>
      </div>
    }
  </div>
</app-section>
