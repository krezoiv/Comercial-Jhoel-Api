<div class="presentation-units">
  <app-page-header
    icon="layers"
    title="Presentaciones y Medidas"
    subtitle="Catálogos centrales para los tipos de presentación y unidades de medida que usan los productos — se seleccionan desde aquí, nunca se escriben libremente en cada producto."
  />

  <div class="tabs" role="tablist">
    <button
      type="button"
      role="tab"
      class="tab"
      [class.tab--active]="activeTab() === 'presentaciones'"
      [attr.aria-selected]="activeTab() === 'presentaciones'"
      (click)="selectTab('presentaciones')"
    >
      Tipos de Presentación
    </button>
    <button
      type="button"
      role="tab"
      class="tab"
      [class.tab--active]="activeTab() === 'unidades'"
      [attr.aria-selected]="activeTab() === 'unidades'"
      (click)="selectTab('unidades')"
    >
      Unidades de Medida
    </button>
  </div>

  @if (activeTab() === 'presentaciones') {
    <app-presentation-types-tab />
  } @else {
    <app-units-of-measure-tab />
  }
</div>
