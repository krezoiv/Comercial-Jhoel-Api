@if (open && role) {
  <div class="modal-backdrop" (click)="cancelled.emit()">
    <div class="modal" (click)="$event.stopPropagation()">
      <div class="modal__icon">
        <app-icon name="alert-triangle" [size]="24" />
      </div>

      <h2 class="modal__title">¿Estás seguro de desactivar este rol?</h2>
      <p class="modal__description">
        <strong>{{ role.name }}</strong> se desactivará y no podrá asignarse a nuevos usuarios. No se elimina
        permanentemente.
      </p>

      <div class="modal__actions">
        <app-button variant="ghost" [disabled]="isDeleting" (click)="cancelled.emit()">Cancelar</app-button>
        <app-button variant="danger" [disabled]="isDeleting" (click)="confirmed.emit()">
          {{ isDeleting ? 'Desactivando…' : 'Sí, desactivar' }}
        </app-button>
      </div>
    </div>
  </div>
}
