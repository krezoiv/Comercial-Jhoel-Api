@if (banks().length > 0) {
  <div class="catalog-banks">
    <div class="catalog-banks__glow" [appParallaxLayer]="0.06" aria-hidden="true"></div>

    <div appRevealOnScroll>
      <app-section-heading
        eyebrow="Bancos"
        title="Bancos con los que trabajamos"
        subtitle="Conoce las entidades bancarias con las que puedes operar a través de Comercial Jhoel."
      />
    </div>

    <div class="catalog-banks__carousel" appRevealOnScroll [revealDelay]="80">
      <app-bank-carousel [banks]="banks()" (imageZoom)="onImageZoom($event)" />
    </div>
  </div>
}

<app-image-lightbox [imageUrl]="zoomedImageUrl()" [alt]="zoomedImageAlt()" (closed)="closeImageLightbox()" />
