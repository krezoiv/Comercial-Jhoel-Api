<div class="search">
  <label class="search__box" for="ice-cream-purchase-search">
    <app-icon name="search" [size]="18" />
    <input
      id="ice-cream-purchase-search"
      type="text"
      placeholder="Buscar helado por SKU o nombre…"
      autocomplete="off"
      [ngModel]="query()"
      (ngModelChange)="onInput($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      (keydown.enter)="onEnter()"
    />
    @if (loading()) {
      <app-icon name="clock" [size]="16" class="search__spinner" />
    }
  </label>

  @if (open() && (results().length > 0 || hasSearched())) {
    <div class="search__dropdown">
      @if (results().length === 0) {
        <p class="search__empty">No se encontraron helados activos.</p>
      } @else {
        @for (iceCream of results(); track iceCream.id) {
          <button type="button" class="search__result" (click)="select(iceCream)">
            <div class="search__result-info">
              <span class="search__result-name">{{ iceCream.product }}</span>
              <span class="search__result-meta">{{ iceCream.sku }} · Stock: {{ formatQuantity(iceCream.stock) }}</span>
            </div>
            <div class="search__result-stats">
              <span class="search__result-price">Costo: {{ formatCurrency(iceCream.costPrice) }}</span>
              <span class="search__result-price search__result-price--public">
                Público: {{ formatCurrency(iceCream.publicPrice) }}
              </span>
            </div>
          </button>
        }
      }
    </div>
  }
</div>
