@if (selectedClient) {
  <div class="search__selected">
    <span class="search__selected-name">{{ selectedClient.name }}</span>
    <button type="button" class="search__selected-clear" (click)="clear()" title="Quitar filtro de cliente">
      <app-icon name="close" [size]="14" />
    </button>
  </div>
} @else {
  <div class="search">
    <label class="search__box" for="report-client-filter">
      <app-icon name="search" [size]="16" />
      <input
        id="report-client-filter"
        type="text"
        placeholder="Todos los clientes"
        autocomplete="off"
        [ngModel]="query()"
        (ngModelChange)="onInput($event)"
        (focus)="onFocus()"
        (blur)="onBlur()"
      />
      @if (loading()) {
        <app-icon name="clock" [size]="14" class="search__spinner" />
      }
    </label>

    @if (open()) {
      <div class="search__dropdown">
        @if (filteredClients().length === 0) {
          <p class="search__empty">No se encontraron clientes.</p>
        } @else {
          @for (client of filteredClients(); track client.id) {
            <button type="button" class="search__result" (click)="select(client)">
              <span class="search__result-name">{{ client.name }}</span>
            </button>
          }
        }
      </div>
    }
  </div>
}
