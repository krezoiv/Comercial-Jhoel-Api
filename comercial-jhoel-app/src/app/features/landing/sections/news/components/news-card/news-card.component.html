<div
  class="news-card"
  role="button"
  tabindex="0"
  [attr.aria-label]="'Leer ' + article.title"
  (click)="open()"
  (keydown)="onKeydownOpen($event)"
>
  <div class="news-card__image-wrap">
    @if (imageUrl(); as src) {
      <img class="news-card__image" [src]="src" [alt]="article.title" loading="lazy" />
    } @else {
      <div class="news-card__image-placeholder">
        <app-icon name="newspaper" [size]="40" />
      </div>
    }

    <app-like-button
      class="news-card__like"
      [liked]="liked()"
      [count]="likesCount()"
      [disabled]="likeBusy()"
      [label]="article.title"
      (toggled)="toggleLike()"
    />
  </div>

  <div class="news-card__body">
    <p class="news-card__date">{{ article.publishedAt | date: 'dd/MM/yyyy' }}</p>
    <h3 class="news-card__title">{{ article.title }}</h3>
    <p class="news-card__excerpt">{{ excerpt() }}</p>
    <span class="news-card__cta">
      Leer más
      <app-icon name="chevron-right" [size]="14" />
    </span>
  </div>
</div>
