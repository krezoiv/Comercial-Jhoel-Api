@if (open && background; as background) {
  <div class="modal-backdrop">
    <div class="modal" (click)="$event.stopPropagation()">
      <div class="modal__header">
        <h2 class="modal__title">Vista previa — {{ background.name }}</h2>
        <button type="button" class="modal__close" (click)="close()" aria-label="Cerrar">
          <app-icon name="close" [size]="18" />
        </button>
      </div>

      <div class="preview-stage">
        <app-landing-background-layer
          [imageUrl]="imageUrl"
          [opacity]="background.opacity"
          [overlay]="background.overlay"
          [position]="background.position"
          [size]="background.size"
          [depthEffect]="background.depthEffect"
          [parallax]="background.parallax"
          [movement]="background.movement"
        />
        <div class="preview-stage__content">
          <span class="preview-stage__eyebrow">Sección de ejemplo</span>
          <h3 class="preview-stage__title">Título de ejemplo</h3>
          <p class="preview-stage__text">Este es un texto de ejemplo para verificar que el contenido siga siendo legible.</p>
          <span class="preview-stage__button">Botón de ejemplo</span>
        </div>
      </div>

      <div class="modal__actions">
        <app-button variant="primary" type="button" (click)="close()">Cerrar</app-button>
      </div>
    </div>
  </div>
}
