@if (open && previewBank(); as bank) {
  <div class="modal-backdrop" (click)="close()">
    <div class="modal" (click)="$event.stopPropagation()">
      <div class="modal__header">
        <h2 class="modal__title">Vista previa</h2>
        <button type="button" class="modal__close" (click)="close()" aria-label="Cerrar">
          <app-icon name="close" [size]="18" />
        </button>
      </div>

      <div class="preview-stage">
        <app-bank-card [bank]="bank" [forceFlipped]="showBack()" />
      </div>

      <div class="modal__actions">
        <app-button variant="ghost" type="button" (click)="toggleFace()">
          <app-icon name="rotate-ccw" [size]="16" />
          {{ showBack() ? 'Ver frente' : 'Ver reverso' }}
        </app-button>
        <app-button variant="primary" type="button" (click)="close()">Cerrar</app-button>
      </div>
    </div>
  </div>
}
