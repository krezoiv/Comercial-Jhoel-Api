<div class="catalog-products">
  <app-page-header [icon]="copy.icon" [title]="copy.title" [subtitle]="copy.subtitle">
    <app-button variant="primary" (click)="openCreateForm()">
      <app-icon name="plus" [size]="16" />
      Publicar producto
    </app-button>
  </app-page-header>

  <div class="toolbar">
    <div class="toolbar__row">
      <label class="search" for="catalog-product-filter">
        <app-icon name="search" [size]="18" />
        <input
          id="catalog-product-filter"
          type="text"
          placeholder="Buscar por nombre de producto…"
          [ngModel]="searchTerm()"
          (ngModelChange)="searchTerm.set($event)"
        />
      </label>
    </div>

    <div class="toolbar__filters" role="group" aria-label="Filtrar por estado">
      @for (option of statusOptions; track option.value) {
        <button
          type="button"
          class="filter-chip"
          [class.filter-chip--active]="statusFilter() === option.value"
          (click)="statusFilter.set(option.value)"
        >
          {{ option.label }}
        </button>
      }
    </div>
  </div>

  <app-catalog-product-table
    [products]="filteredProducts()"
    [loading]="loading()"
    [hasActiveFilters]="hasActiveFilters()"
    [emptyTitle]="copy.emptyTitle"
    [emptyDescription]="copy.emptyDescription"
    (edit)="openEditForm($event)"
    (manageImage)="openImage($event)"
    (toggleActive)="toggleActive($event)"
    (moveUp)="moveUp($event)"
    (moveDown)="moveDown($event)"
    (clearFilters)="clearFilters()"
    (addProduct)="openCreateForm()"
  />
</div>

<app-catalog-product-form-modal
  [open]="isFormOpen()"
  [product]="editingProduct()"
  [section]="section"
  (closed)="closeForm()"
  (saved)="onProductSaved($event)"
/>

<app-catalog-product-image-modal [product]="imageProduct()" (closed)="closeImage()" (changed)="onImageChanged($event)" />
