@if (open && bank) {
  <div class="modal-backdrop">
    <div class="modal" (click)="$event.stopPropagation()">
      <div class="modal__header">
        <h2 class="modal__title">Imagen de {{ bank.name }}</h2>
        <button type="button" class="modal__close" (click)="close()" aria-label="Cerrar">
          <app-icon name="close" [size]="18" />
        </button>
      </div>

      <div class="preview">
        @if (imageUrl) {
          <img [src]="imageUrl" [alt]="bank.name" />
        } @else {
          <div class="preview__empty">
            <app-icon name="camera" [size]="32" />
            <p>Sin imagen todavía</p>
          </div>
        }
      </div>

      <div class="actions">
        <label class="upload-btn">
          <input type="file" accept="image/jpeg,image/png,image/webp" (change)="onFileSelected($event)" [disabled]="isUploading()" />
          <app-icon name="upload" [size]="16" />
          {{ isUploading() ? 'Subiendo…' : imageUrl ? 'Reemplazar imagen' : 'Subir imagen' }}
        </label>

        @if (imageUrl) {
          <app-button variant="ghost" type="button" [disabled]="isRemoving()" (click)="removeImage()">
            <app-icon name="trash-2" [size]="16" />
            {{ isRemoving() ? 'Eliminando…' : 'Eliminar' }}
          </app-button>
        }
      </div>

      <p class="hint">Formatos JPG, PNG o WEBP — máximo 5 MB.</p>

      <div class="modal__actions">
        <app-button variant="primary" type="button" (click)="close()">Cerrar</app-button>
      </div>
    </div>
  </div>
}
