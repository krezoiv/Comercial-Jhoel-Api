<div class="summary">
  <div class="summary__rows">
    <div class="summary__row summary__row--total">
      <span>Total</span>
      <span>{{ formatCurrency(total) }}</span>
    </div>
    @if (itemCount > 0) {
      <p class="summary__hint">
        <app-icon name="check" [size]="14" />
        Inventario ya reservado — se confirma al guardar.
      </p>
    }
  </div>

  <div class="summary__actions">
    <app-button variant="ghost" [disabled]="!canCancel" (click)="cancel.emit()">
      @if (isCancelling) {
        Cancelando…
      } @else {
        Cancelar venta
      }
    </app-button>

    <app-button variant="primary" size="lg" [disabled]="!canSave" (click)="save.emit()">
      @if (isSaving) {
        Guardando…
      } @else {
        <app-icon name="check" [size]="18" />
        Guardar venta
      }
    </app-button>
  </div>
</div>
