<app-line-chart
  title="Compras por mes"
  subtitle="Meses transcurridos del año actual"
  icon="trending-up"
  valueLabel="comprado"
  [formatValue]="formatCurrency"
  [points]="points()"
  [loading]="loading()"
  [loadError]="loadError()"
  emptyTitle="Sin compras registradas este año"
  emptyDescription="Aquí verás el comportamiento mensual en cuanto haya compras registradas."
  (retry)="fetch()"
/>
