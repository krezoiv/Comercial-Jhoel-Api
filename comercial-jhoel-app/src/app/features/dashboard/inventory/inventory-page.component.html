<div class="inventory">
  <app-page-header icon="package" title="Inventario" subtitle="Gestiona y controla los productos disponibles en tu negocio." />

  <app-inventory-summary [data]="products()" />

  <app-inventory-toolbar
    [categories]="categories()"
    [businesses]="businesses()"
    [searchTerm]="searchTerm()"
    [selectedCategory]="selectedCategory()"
    [selectedBusiness]="selectedBusiness()"
    [stockFilter]="stockFilter()"
    [canManage]="isAdmin()"
    [importing]="isImporting()"
    (searchTermChange)="searchTerm.set($event)"
    (selectedCategoryChange)="selectedCategory.set($event)"
    (selectedBusinessChange)="selectedBusiness.set($event)"
    (stockFilterChange)="stockFilter.set($event)"
    (addProduct)="openCreateForm()"
    (transferInventory)="openTransferModal()"
    (exportPdf)="onExportPdf()"
    (exportExcel)="onExportExcel()"
    (importFile)="onImportFile($event)"
    (downloadImportTemplate)="onDownloadImportTemplate()"
  />

  <app-product-table
    [products]="filteredProducts()"
    [loading]="loading()"
    [hasActiveFilters]="hasActiveFilters()"
    [canManage]="isAdmin()"
    (edit)="openEditForm($event)"
    (delete)="requestDelete($event)"
    (clearFilters)="clearFilters()"
    (addProduct)="openCreateForm()"
    (viewDetail)="viewDetail($event)"
  />
</div>

<app-transfer-inventory-modal
  [open]="isTransferOpen()"
  [products]="products()"
  (closed)="closeTransferModal()"
  (completed)="onTransferCompleted()"
/>

<app-product-form-modal
  [open]="isFormOpen()"
  [product]="editingProduct()"
  [categories]="categoryOptions()"
  [businesses]="businessOptions()"
  [unitsOfMeasure]="unitOfMeasureOptions()"
  (closed)="closeForm()"
  (saved)="onProductSaved($event)"
/>

<app-delete-confirm-modal
  [open]="isDeleteOpen()"
  [product]="deletingProduct()"
  [isDeleting]="isDeleting()"
  (confirmed)="confirmDelete()"
  (cancelled)="cancelDelete()"
/>

<app-import-results-modal
  [open]="isImportResultsOpen()"
  [result]="importResult()"
  (closed)="closeImportResults()"
/>
