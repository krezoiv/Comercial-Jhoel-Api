@if (open) {
  <div class="modal-backdrop">
    <div class="modal" (click)="$event.stopPropagation()">
      <div class="modal__header">
        <h2 class="modal__title">{{ isEditMode ? 'Editar noticia' : 'Agregar noticia' }}</h2>
        <button type="button" class="modal__close" (click)="close()" aria-label="Cerrar">
          <app-icon name="close" [size]="18" />
        </button>
      </div>

      <form class="modal__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="field">
          <label for="news-title">Título *</label>
          <input id="news-title" type="text" formControlName="title" placeholder="Ej. Nueva promoción de temporada" maxlength="200" />
        </div>

        <div class="field">
          <label for="news-published-at">Fecha de publicación *</label>
          <input id="news-published-at" type="date" formControlName="publishedAt" />
        </div>

        <div class="field">
          <label for="news-type">Tipo de noticia *</label>
          <select id="news-type" formControlName="newsTypeId">
            <option value="" disabled>Selecciona un tipo…</option>
            @for (type of allTypes(); track type.id) {
              <option [value]="type.id" [disabled]="!isSelectableType(type)">
                {{ type.name }}{{ !type.isActive ? ' (inactivo)' : '' }}
              </option>
            }
          </select>
        </div>

        <div class="field">
          <label for="news-description">Descripción *</label>
          <textarea id="news-description" formControlName="description" rows="6" placeholder="Contenido de la noticia…"></textarea>
        </div>

        @if (errorMessage()) {
          <p class="modal__error">{{ errorMessage() }}</p>
        }

        <div class="modal__actions">
          <app-button variant="ghost" type="button" [disabled]="isSubmitting()" (click)="close()">Cancelar</app-button>
          <app-button variant="primary" type="submit" [disabled]="isSubmitting()">
            {{ isSubmitting() ? 'Guardando…' : 'Guardar' }}
          </app-button>
        </div>
      </form>
    </div>
  </div>
}
