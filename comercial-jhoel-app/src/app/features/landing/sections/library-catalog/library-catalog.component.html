@if (products().length > 0) {
  <app-section sectionId="libreria" tone="light" spacing="lg">
    <div class="library-catalog__glow" aria-hidden="true"></div>

    <div appRevealOnScroll>
      <app-section-heading
        eyebrow="Librería"
        title="Todo para tus útiles y oficina"
        subtitle="Explora nuestro catálogo de productos de librería — información completa, sin compromiso de compra en línea."
      />
    </div>

    <div class="library-catalog__carousel" appRevealOnScroll [revealDelay]="80">
      <app-catalog-product-carousel
        [products]="products()"
        [showInterestButton]="false"
        ariaLabel="Catálogo de librería"
        (imageZoom)="onImageZoom($event)"
      />
    </div>
  </app-section>
}

<app-image-lightbox [imageUrl]="zoomedImageUrl()" [alt]="zoomedImageAlt()" (closed)="closeImageLightbox()" />
