<div class="search">
  <label class="search__box" for="purchase-product-search">
    <app-icon name="search" [size]="18" />
    <input
      id="purchase-product-search"
      type="text"
      placeholder="Buscar producto por SKU o nombre…"
      autocomplete="off"
      [ngModel]="query()"
      (ngModelChange)="onInput($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      (keydown.enter)="onEnter()"
    />
    @if (loading()) {
      <app-icon name="clock" [size]="16" class="search__spinner" />
    }
  </label>

  @if (open() && (results().length > 0 || hasSearched())) {
    <div class="search__dropdown">
      @if (results().length === 0) {
        <p class="search__empty">No se encontraron productos activos.</p>
      } @else {
        @for (product of results(); track product.id) {
          <button type="button" class="search__result" (click)="select(product)">
            <div class="search__result-info">
              <span class="search__result-name">
                {{ product.name }}
                @if (product.matchedPresentation) {
                  <span class="search__result-badge">{{ product.matchedPresentation.name }}</span>
                }
              </span>
              <span class="search__result-meta">{{ product.sku || 'Sin SKU' }} · Stock: {{ formatQuantity(product.stock) }}</span>
            </div>
            <div class="search__result-stats">
              <span class="search__result-price">Costo: {{ formatCurrency(product.costPrice) }}</span>
              <span class="search__result-price search__result-price--public">
                Público: {{ formatCurrency(product.publicPrice) }}
              </span>
            </div>
          </button>
        }
      }
    </div>
  }
</div>
