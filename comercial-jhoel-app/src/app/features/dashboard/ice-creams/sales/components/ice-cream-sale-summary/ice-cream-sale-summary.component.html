<div class="summary">
  <div class="summary__row summary__row--total">
    <span>Total</span>
    <span>{{ formatCurrency(total) }}</span>
  </div>

  <div class="summary__actions">
    <app-button variant="ghost" [disabled]="!canCancel" (click)="cancel.emit()">Cancelar</app-button>
    <app-button variant="primary" size="lg" [disabled]="!canSave" (click)="save.emit()">
      {{ isSaving ? 'Guardando…' : 'Guardar venta' }}
    </app-button>
  </div>
</div>
