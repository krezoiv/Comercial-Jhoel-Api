<header class="topbar" [class.topbar--scrolled]="isScrolled()">
  <button type="button" class="topbar__menu-btn" (click)="menuToggled.emit()" aria-label="Abrir menú del panel">
    <app-icon name="menu" [size]="22" />
  </button>

  @if (currentPageLabel(); as pageLabel) {
    <div class="topbar__page-title">{{ pageLabel }}</div>
  }

  <div class="topbar__datetime">
    <span class="topbar__datetime-icon">
      <app-icon name="clock" [size]="14" />
    </span>
    <span>{{ now() | date: "EEEE d 'de' MMMM · h:mm:ss a" }}</span>
  </div>

  <button
    type="button"
    class="topbar__theme-toggle"
    role="switch"
    [attr.aria-checked]="isDarkTheme()"
    [attr.aria-label]="isDarkTheme() ? 'Activar modo claro' : 'Activar modo oscuro'"
    [title]="isDarkTheme() ? 'Activar modo claro' : 'Activar modo oscuro'"
    (click)="toggleTheme()"
  >
    <span class="topbar__theme-track" [class.topbar__theme-track--dark]="isDarkTheme()">
      <app-icon name="sun" [size]="12" class="topbar__theme-icon topbar__theme-icon--sun" />
      <app-icon name="moon" [size]="12" class="topbar__theme-icon topbar__theme-icon--moon" />
      <span class="topbar__theme-thumb">
        <app-icon [name]="isDarkTheme() ? 'moon' : 'sun'" [size]="12" />
      </span>
    </span>
  </button>

  <app-alert-bell />

  <div class="topbar__user">
    <button type="button" class="topbar__user-trigger" (click)="toggleUserMenu()" [attr.aria-expanded]="isUserMenuOpen()">
      <span class="topbar__avatar">
        <app-icon name="user" [size]="18" />
      </span>
      <span class="topbar__user-info">
        <strong>{{ currentUser()?.username }}</strong>
        <span>{{ currentUser()?.phone }}</span>
      </span>
      <app-icon name="chevron-down" [size]="16" />
    </button>

    @if (isUserMenuOpen()) {
      <button type="button" class="topbar__backdrop" (click)="closeUserMenu()" aria-hidden="true" tabindex="-1"></button>

      <div class="topbar__menu">
        <button type="button" class="topbar__menu-item" (click)="requestChangePassword()">
          <app-icon name="lock" [size]="16" />
          Cambiar contraseña
        </button>
        <a class="topbar__menu-item" routerLink="/" (click)="closeUserMenu()">
          <app-icon name="arrow-right" [size]="16" />
          Ir a la página principal
        </a>
        <button type="button" class="topbar__menu-item topbar__menu-item--danger" (click)="requestLogout()">
          <app-icon name="log-out" [size]="16" />
          Cerrar sesión
        </button>
      </div>
    }
  </div>
</header>
