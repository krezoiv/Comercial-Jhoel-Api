<div class="roles">
  <app-page-header icon="shield-check" title="Roles" subtitle="Gestiona los roles y permisos del sistema." />

  <app-role-summary [data]="roles()" />

  <app-role-toolbar
    [searchTerm]="searchTerm()"
    [statusFilter]="statusFilter()"
    (searchTermChange)="searchTerm.set($event)"
    (statusFilterChange)="statusFilter.set($event)"
    (addRole)="openCreateForm()"
  />

  <app-role-table
    [roles]="filteredRoles()"
    [loading]="loading()"
    [hasActiveFilters]="hasActiveFilters()"
    (edit)="openEditForm($event)"
    (delete)="requestDelete($event)"
    (clearFilters)="clearFilters()"
    (addRole)="openCreateForm()"
  />
</div>

<app-role-form-modal
  [open]="isFormOpen()"
  [role]="editingRole()"
  (closed)="closeForm()"
  (saved)="onRoleSaved($event)"
/>

<app-role-delete-confirm-modal
  [open]="isDeleteOpen()"
  [role]="deletingRole()"
  [isDeleting]="isDeleting()"
  (confirmed)="confirmDelete()"
  (cancelled)="cancelDelete()"
/>
