<div class="home">
  <header class="home__header">
    <div class="home__icon">
      <app-icon name="grid" [size]="24" />
    </div>
    <div>
      <p class="home__eyebrow">{{ today() | date: "EEEE d 'de' MMMM, yyyy" }}</p>
      <h1 class="home__title">Hola, {{ currentUser()?.username }}</h1>
      <p class="home__subtitle">Este es el resumen rápido de tu negocio hoy.</p>
    </div>
  </header>

  <div class="home__grid">
    @for (item of summary$ | async; track item.id) {
      <app-card padding="lg">
        <a class="summary-card" [routerLink]="['/dashboard', item.path]">
          <app-summary-tile [icon]="item.icon" [title]="item.title" [value]="item.value" [description]="item.description" tone="primary" />
        </a>
      </app-card>
    }
  </div>

  <section class="home__daily-transactions">
    <app-transaction-summary-card
      title="Resumen Diario de Transacciones"
      [summary]="dailyTransactionSummary()?.daily ?? { totalTransactions: 0, byBank: [] }"
      [loading]="loadingDailyTransactionSummary()"
    />
    <app-transaction-summary-card
      title="Resumen Mensual de Transacciones"
      [subtitle]="(today() | date: 'MMMM yyyy' | titlecase) ?? ''"
      [summary]="dailyTransactionSummary()?.monthly ?? { totalTransactions: 0, byBank: [] }"
      [loading]="loadingDailyTransactionSummary()"
    />
  </section>

  @if (isAdmin()) {
    <app-financial-indicators
      [metrics]="financialMetrics()"
      [loading]="loadingFinancialMetrics()"
      [dailyBankTransactionCount]="dailyTransactionSummary()?.daily?.totalTransactions ?? 0"
    />
  }
</div>
