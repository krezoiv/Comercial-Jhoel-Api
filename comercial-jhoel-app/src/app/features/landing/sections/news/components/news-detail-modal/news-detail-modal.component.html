@if (open && article) {
  <div class="modal-backdrop" (click)="close()">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="news-detail-title" (click)="$event.stopPropagation()">
      <button type="button" class="modal__close" (click)="close()" aria-label="Cerrar">
        <app-icon name="close" [size]="18" />
      </button>

      @if (imageUrl(); as src) {
        <div class="modal__image-wrap">
          <img class="modal__image" [src]="src" [alt]="article.title" />
        </div>
      }

      <div class="modal__content">
        <p class="modal__date">{{ article.publishedAt | date: 'dd/MM/yyyy' }}</p>
        <h2 class="modal__title" id="news-detail-title">{{ article.title }}</h2>
        <p class="modal__description">{{ article.description }}</p>

        <div class="modal__actions">
          <app-button variant="ghost" type="button" (click)="close()">Cerrar</app-button>
        </div>
      </div>
    </div>
  </div>
}
