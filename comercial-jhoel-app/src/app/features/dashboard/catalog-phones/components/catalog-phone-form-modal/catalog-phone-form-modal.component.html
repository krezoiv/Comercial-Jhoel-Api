@if (open) {
  <div class="modal-backdrop">
    <div class="modal" (click)="$event.stopPropagation()">
      <div class="modal__header">
        <h2 class="modal__title">{{ isEditMode ? 'Editar teléfono' : 'Agregar teléfono' }}</h2>
        <button type="button" class="modal__close" (click)="close()" aria-label="Cerrar">
          <app-icon name="close" [size]="18" />
        </button>
      </div>

      <form class="modal__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="phone-brand">Marca *</label>
            <input id="phone-brand" type="text" formControlName="brand" placeholder="Ej. Samsung" />
          </div>
          <div class="field">
            <label for="phone-model">Modelo *</label>
            <input id="phone-model" type="text" formControlName="model" placeholder="Ej. Galaxy A55" />
          </div>
          <div class="field">
            <label for="phone-price">Precio público (Q) *</label>
            <input id="phone-price" type="number" min="0" step="0.01" formControlName="price" />
          </div>
        </div>

        <div class="field">
          <label for="phone-description">Descripción</label>
          <textarea id="phone-description" formControlName="description" rows="3" maxlength="2000"></textarea>
        </div>

        <h3 class="section-title">Especificaciones</h3>
        <div class="form-grid">
          <div class="field">
            <label for="phone-screen">Pantalla</label>
            <input id="phone-screen" type="text" formControlName="screen" placeholder="Ej. 6.6&quot; Super AMOLED" />
          </div>
          <div class="field">
            <label for="phone-ram">RAM</label>
            <input id="phone-ram" type="text" formControlName="ram" placeholder="Ej. 8 GB" />
          </div>
          <div class="field">
            <label for="phone-storage">Almacenamiento</label>
            <input id="phone-storage" type="text" formControlName="storage" placeholder="Ej. 256 GB" />
          </div>
          <div class="field">
            <label for="phone-camera">Cámara</label>
            <input id="phone-camera" type="text" formControlName="camera" placeholder="Ej. 50 MP + 12 MP" />
          </div>
          <div class="field">
            <label for="phone-battery">Batería</label>
            <input id="phone-battery" type="text" formControlName="battery" placeholder="Ej. 5000 mAh" />
          </div>
          <div class="field">
            <label for="phone-processor">Procesador</label>
            <input id="phone-processor" type="text" formControlName="processor" placeholder="Ej. Exynos 1480" />
          </div>
          <div class="field">
            <label for="phone-os">Sistema operativo</label>
            <input id="phone-os" type="text" formControlName="operatingSystem" placeholder="Ej. Android 14" />
          </div>
        </div>

        <div class="extra-specs">
          <div class="extra-specs__header">
            <h3 class="section-title">Otras especificaciones</h3>
            <app-button variant="ghost" type="button" (click)="addExtraSpec()">
              <app-icon name="plus" [size]="14" />
              Agregar
            </app-button>
          </div>

          @for (spec of extraSpecs.controls; track $index; let i = $index) {
            <div class="extra-spec-row" [formGroup]="$any(spec)">
              <input type="text" formControlName="label" placeholder="Etiqueta (ej. Resistencia al agua)" maxlength="80" />
              <input type="text" formControlName="value" placeholder="Valor (ej. IP67)" maxlength="200" />
              <button type="button" class="extra-spec-remove" (click)="removeExtraSpec(i)" aria-label="Quitar especificación">
                <app-icon name="close" [size]="14" />
              </button>
            </div>
          }
        </div>

        @if (errorMessage()) {
          <p class="modal__error">{{ errorMessage() }}</p>
        }

        <div class="modal__actions">
          <app-button variant="ghost" type="button" [disabled]="isSubmitting()" (click)="close()">Cancelar</app-button>
          <app-button variant="primary" type="submit" [disabled]="isSubmitting()">
            {{ isSubmitting() ? 'Guardando…' : 'Guardar' }}
          </app-button>
        </div>
      </form>
    </div>
  </div>
}
