<div class="summary-grid" [class.summary-grid--loading]="loading">
  @for (tile of tiles; track tile.title) {
    <app-card padding="lg">
      <app-summary-tile
        [icon]="tile.icon"
        [title]="tile.title"
        [value]="loading ? '—' : tile.value"
        [description]="tile.description"
        [tone]="tile.tone ?? 'primary'"
      />
    </app-card>
  }
</div>
