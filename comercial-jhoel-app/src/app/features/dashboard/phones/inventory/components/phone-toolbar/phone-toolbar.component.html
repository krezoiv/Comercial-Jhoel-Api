<div class="toolbar">
  <div class="toolbar__row">
    <label class="search" for="phone-search">
      <app-icon name="search" [size]="18" />
      <input
        id="phone-search"
        type="text"
        placeholder="Buscar por número o IMEI…"
        [ngModel]="searchTerm"
        (ngModelChange)="searchTermChange.emit($event)"
      />
    </label>

    <button type="button" class="clear-btn" (click)="clearFilters.emit()">
      <app-icon name="x-circle" [size]="14" />
      Limpiar filtros
    </button>
  </div>

  <div class="toolbar__filters" role="group" aria-label="Filtrar por operadora">
    @for (option of operatorOptions; track option.value) {
      <button
        type="button"
        class="filter-chip"
        [class.filter-chip--active]="operatorFilter === option.value"
        (click)="operatorFilterChange.emit(option.value)"
      >
        {{ option.label }}
      </button>
    }
  </div>

  <div class="toolbar__filters" role="group" aria-label="Filtrar por estado">
    @for (option of statusOptions; track option.value) {
      <button
        type="button"
        class="filter-chip"
        [class.filter-chip--active]="statusFilter === option.value"
        (click)="statusFilterChange.emit(option.value)"
      >
        {{ option.label }}
      </button>
    }
  </div>

  <div class="toolbar__date-ranges">
    <div class="date-range">
      <span class="date-range__label">Fecha de compra</span>
      <input
        type="date"
        aria-label="Fecha de compra desde"
        [ngModel]="purchaseDateFrom"
        (ngModelChange)="purchaseDateFromChange.emit($event)"
      />
      <span class="date-range__sep">—</span>
      <input
        type="date"
        aria-label="Fecha de compra hasta"
        [ngModel]="purchaseDateTo"
        (ngModelChange)="purchaseDateToChange.emit($event)"
      />
    </div>

    <div class="date-range">
      <span class="date-range__label">Fecha de venta</span>
      <input
        type="date"
        aria-label="Fecha de venta desde"
        [ngModel]="saleDateFrom"
        (ngModelChange)="saleDateFromChange.emit($event)"
      />
      <span class="date-range__sep">—</span>
      <input
        type="date"
        aria-label="Fecha de venta hasta"
        [ngModel]="saleDateTo"
        (ngModelChange)="saleDateToChange.emit($event)"
      />
    </div>
  </div>
</div>
