<app-landing-carousel [items]="products" [ariaLabel]="ariaLabel" itemNoun="producto" [itemLabel]="productLabel">
  <ng-template let-product>
    <app-catalog-product-card
      [product]="product"
      [showInterestButton]="showInterestButton"
      [enhancedEffects]="enhancedEffects"
      (interest)="onInterest(product)"
      (imageZoom)="onImageZoom($event)"
    />
  </ng-template>
</app-landing-carousel>
