<app-line-chart
  title="Ventas por mes"
  subtitle="Meses transcurridos del año actual"
  icon="trending-up"
  valueLabel="vendido"
  [formatValue]="formatCurrency"
  [points]="points()"
  [loading]="loading()"
  [loadError]="loadError()"
  emptyTitle="Sin ventas registradas este año"
  emptyDescription="Aquí verás el comportamiento mensual en cuanto haya ventas registradas."
  (retry)="fetch()"
/>
