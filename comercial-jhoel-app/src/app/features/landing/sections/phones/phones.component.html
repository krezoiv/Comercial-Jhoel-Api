@if (phones().length > 0) {
  <app-section sectionId="telefonos" tone="dark" spacing="lg">
    <app-section-landing-background sectionKey="telefonos" />
    <div class="phones__glow phones__glow--primary" [appParallaxLayer]="0.05" aria-hidden="true"></div>
    <div class="phones__glow phones__glow--gold" [appParallaxLayer]="0.09" aria-hidden="true"></div>

    <div appRevealOnScroll>
      <app-section-heading
        eyebrow="Teléfonos"
        title="Encuentra tu próximo teléfono"
        subtitle="Explora nuestro catálogo y descubre las opciones de compra directa o a crédito con Krediya."
      />
    </div>

    <div class="phones__carousel" appRevealOnScroll [revealDelay]="80">
      <app-phone-carousel [phones]="phones()" (requestInterest)="onRequestInterest($event)" (imageZoom)="onImageZoom($event)" />
    </div>
  </app-section>
}

<app-phone-interest-modal [phone]="selectedPhone()" [requestType]="selectedRequestType()" (closed)="closeInterestModal()" />

<app-image-lightbox [imageUrl]="zoomedImageUrl()" [alt]="zoomedImageAlt()" (closed)="closeImageLightbox()" />
