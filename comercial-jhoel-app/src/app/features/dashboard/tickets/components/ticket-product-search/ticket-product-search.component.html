<div class="search">
  <label class="search__box" for="ticket-product-search">
    <app-icon name="search" [size]="18" />
    <input
      id="ticket-product-search"
      type="text"
      placeholder="Buscar producto por SKU o nombre…"
      autocomplete="off"
      [ngModel]="query()"
      (ngModelChange)="onInput($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      (keydown.enter)="onEnter()"
    />
    @if (loading()) {
      <app-icon name="clock" [size]="16" class="search__spinner" />
    }
    <button
      type="button"
      class="search__scan-btn"
      title="Escanear código de barras"
      (click)="openScanner()"
    >
      <app-icon name="camera" [size]="16" />
    </button>
  </label>

  <app-barcode-scanner-modal
    [open]="scannerOpen()"
    (scanned)="onBarcodeScanned($event)"
    (closed)="scannerOpen.set(false)"
  />

  @if (open() && (results().length > 0 || hasSearched())) {
    <div class="search__dropdown">
      @if (results().length === 0) {
        <p class="search__empty">No se encontraron productos activos.</p>
      } @else {
        @for (product of results(); track product.id) {
          <button type="button" class="search__result" (click)="select(product)">
            <div class="search__result-info">
              <span class="search__result-name">{{ product.name }}</span>
              <span class="search__result-meta">{{ product.sku || 'Sin SKU' }} · {{ product.category }}</span>
            </div>
            <div class="search__result-stats">
              <span class="search__result-price">{{ formatCurrency(product.publicPrice) }}</span>
            </div>
          </button>
        }
      }
    </div>
  }
</div>
