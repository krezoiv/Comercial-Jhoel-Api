<div class="news">
  <app-page-header
    icon="newspaper"
    title="Noticias"
    subtitle="Administra las noticias publicadas en la landing pública: título, imagen, descripción, fecha, orden y estado."
  >
    <app-button variant="primary" (click)="openCreateForm()">
      <app-icon name="plus" [size]="16" />
      Agregar noticia
    </app-button>
  </app-page-header>

  <div class="toolbar">
    <div class="toolbar__row">
      <label class="search" for="news-search">
        <app-icon name="search" [size]="18" />
        <input
          id="news-search"
          type="text"
          placeholder="Buscar por título…"
          [ngModel]="searchTerm()"
          (ngModelChange)="searchTerm.set($event)"
        />
      </label>
    </div>

    <div class="toolbar__filters" role="group" aria-label="Filtrar por estado">
      @for (option of statusOptions; track option.value) {
        <button
          type="button"
          class="filter-chip"
          [class.filter-chip--active]="statusFilter() === option.value"
          (click)="statusFilter.set(option.value)"
        >
          {{ option.label }}
        </button>
      }
    </div>
  </div>

  <app-news-table
    [articles]="filteredArticles()"
    [loading]="loading()"
    [hasActiveFilters]="hasActiveFilters()"
    (edit)="openEditForm($event)"
    (manageImage)="openImage($event)"
    (toggleActive)="toggleActive($event)"
    (moveUp)="moveUp($event)"
    (moveDown)="moveDown($event)"
    (clearFilters)="clearFilters()"
    (addArticle)="openCreateForm()"
  />
</div>

<app-news-form-modal [open]="isFormOpen()" [article]="editingArticle()" (closed)="closeForm()" (saved)="onArticleSaved($event)" />

<app-news-image-modal [article]="imageArticle()" (closed)="closeImage()" (changed)="onImageChanged($event)" />
