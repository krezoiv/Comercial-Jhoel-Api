<div class="sales">
  <app-page-header icon="receipt" title="Ventas" subtitle="Registra y administra las ventas de tu negocio.">
    <div class="sales__date">
      <span class="sales__date-label">Fecha</span>
      <span class="sales__date-value">{{ today() | date: 'dd/MM/yyyy' }}</span>
    </div>
  </app-page-header>

  <div class="sales__tabs" role="tablist" aria-label="Ventas abiertas">
    @for (draftItem of draft.drafts(); track draftItem.draftKey) {
      <div
        class="sales__tab"
        role="tab"
        [class.sales__tab--active]="draftItem.draftKey === draft.activeDraftId()"
        [attr.aria-selected]="draftItem.draftKey === draft.activeDraftId()"
        (click)="switchDraft(draftItem.draftKey)"
      >
        @if (draftHasItems(draftItem)) {
          <span class="sales__tab-dot" aria-hidden="true"></span>
        }
        <span class="sales__tab-label">{{ draftLabel(draftItem) }}</span>
        <button
          type="button"
          class="sales__tab-close"
          [attr.aria-label]="'Cerrar ' + draftLabel(draftItem)"
          (click)="requestCloseTab(draftItem.draftKey); $event.stopPropagation()"
        >
          ×
        </button>
      </div>
    }
    <button type="button" class="sales__tab-add" (click)="openNewDraft()" aria-label="Nueva venta">
      + Nueva venta
    </button>
  </div>

  <app-sale-pricing-bar
    [clientId]="draft.clientId()"
    [clientName]="draft.clientName()"
    [priceList]="draft.priceList()"
    [locked]="draft.items().length > 0"
    [disabled]="draft.isConfiguringPricing()"
    (configure)="onConfigurePricing($event)"
  />

  <app-product-search [priceList]="draft.priceList()" (productSelected)="onProductSelected($event)" />

  <div class="sales__receipt">
    <app-sale-items-table
      [items]="draft.items()"
      [pendingProductIds]="draft.pendingProductIds()"
      (quantityChange)="onQuantityChange($event)"
      (removeItem)="onRemoveItem($event)"
    />

    <app-sale-summary
      [itemCount]="draft.items().length"
      [total]="draft.total()"
      [isSaving]="draft.isSaving()"
      [isCancelling]="draft.isCancelling()"
      [invoiceNumber]="draft.invoiceNumberDraft()"
      (save)="saveSale()"
      (cancel)="requestCancel()"
      (invoiceNumberChange)="draft.setInvoiceNumberDraft($event)"
    />
  </div>
</div>

<app-sale-cancel-confirm-modal
  [open]="closeConfirmDraftId() !== null"
  (confirmed)="confirmCloseTab()"
  (cancelled)="dismissCancel()"
/>
